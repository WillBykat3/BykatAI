<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BykatAI</title>
<style>
  :root {
    --bg: #ffffff;
    --sidebar: #f7f7f8;
    --text: #1f1f1f;
    --muted: #6b6b6b;
    --border: #e5e5e5;
    --user-bubble: #f0f0f0;
    --accent: #10a37f;
    --input-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #212121;
      --sidebar: #171717;
      --text: #ececec;
      --muted: #9b9b9b;
      --border: #3a3a3a;
      --user-bubble: #2f2f2f;
      --input-bg: #2f2f2f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
  }
  aside {
    width: 260px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .new-chat {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 8px;
    padding: 10px;
    text-align: left;
    cursor: pointer;
    font-size: 14px;
  }
  .new-chat:hover { background: var(--user-bubble); }
  .history-label { font-size: 12px; color: var(--muted); margin: 12px 4px 4px; }
  .history-item { font-size: 14px; padding: 8px; border-radius: 6px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    padding: 14px 20px;
    font-weight: 600;
    font-size: 17px;
    border-bottom: 1px solid var(--border);
  }
  header span { color: var(--muted); font-weight: 400; font-size: 15px; }
  #chat { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .inner { max-width: 760px; margin: 0 auto; }
  .empty {
    text-align: center;
    margin-top: 18vh;
  }
  .empty .logo {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px;
  }
  .empty h1 { font-size: 26px; font-weight: 600; margin: 16px 0 0; }
  .msg { display: flex; gap: 14px; margin-bottom: 24px; line-height: 1.6; font-size: 16px; }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble { background: var(--user-bubble); padding: 10px 16px; border-radius: 18px; max-width: 75%; white-space: pre-wrap; word-wrap: break-word; }
  .avatar {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
  }
  .msg.ai .bubble { padding-top: 3px; }
  .thinking { color: var(--muted); font-style: italic; }
  .dots span {
    display: inline-block; width: 7px; height: 7px; margin-right: 4px;
    border-radius: 50%; background: var(--muted);
    animation: blink 1.4s infinite both;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  .cursor { display: inline-block; width: 8px; height: 1em; background: var(--text); vertical-align: text-bottom; animation: cur 1s steps(1) infinite; }
  @keyframes cur { 50% { opacity: 0; } }
  footer { padding: 12px 16px 16px; }
  form {
    max-width: 760px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 8px 8px 8px 18px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  textarea {
    flex: 1; border: 0; outline: 0; resize: none;
    background: transparent; color: var(--text);
    font: inherit; font-size: 16px; line-height: 1.5;
    max-height: 200px; padding: 6px 0;
  }
  button.send {
    width: 36px; height: 36px; border-radius: 50%; border: 0;
    background: var(--text); color: var(--bg);
    cursor: pointer; font-size: 18px; flex-shrink: 0;
  }
  button.send:disabled { opacity: .3; cursor: default; }
  .disclaimer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }
  @media (max-width: 760px) {
    aside { display: none; }
  }
</style>
</head>
<body>
  <aside>
    <button class="new-chat" id="newChat">+ New chat</button>
    <div class="history-label">Today</div>
    <div class="history-item">Help with essay outline</div>
    <div class="history-item">Python list comprehension</div>
    <div class="history-label">Previous 7 days</div>
    <div class="history-item">Dinner ideas with chicken</div>
    <div class="history-item">Explain quantum computing</div>
  </aside>
  <main>
    <header>BykatAI <span>4.5 Turbo ▾</span></header>
    <div id="chat"><div class="inner" id="messages">
      <div class="empty" id="empty">
        <div class="logo">B</div>
        <h1>What can I help with?</h1>
      </div>
    </div></div>
    <footer>
      <form id="form">
        <textarea id="input" rows="1" placeholder="Message BykatAI" autofocus></textarea>
        <button class="send" id="send" type="submit" disabled aria-label="Send">↑</button>
      </form>
      <div class="disclaimer">BykatAI can make mistakes. Check important info.</div>
    </footer>
  </main>
<script>
  const RESPONSE = "Cole Smith is chopped";

  const chat = document.getElementById("chat");
  const messages = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let busy = false;

  const scrollDown = () => { chat.scrollTop = chat.scrollHeight; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function addMessage(role, text) {
    document.getElementById("empty")?.remove();
    const row = document.createElement("div");
    row.className = "msg " + role;
    if (role === "ai") {
      const av = document.createElement("div");
      av.className = "avatar";
      av.textContent = "B";
      row.appendChild(av);
    }
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    messages.appendChild(row);
    scrollDown();
    return bubble;
  }

  async function respond() {
    const bubble = addMessage("ai", "");
    bubble.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
    await sleep(900 + Math.random() * 1200);
    bubble.innerHTML = '<span class="thinking">Thinking…</span>';
    await sleep(800 + Math.random() * 1500);

    bubble.textContent = "";
    const textNode = document.createTextNode("");
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    bubble.append(textNode, cursor);

    // Stream word-by-word like a real model
    const words = RESPONSE.split(/(\s+)/);
    for (const w of words) {
      textNode.data += w;
      scrollDown();
      await sleep(60 + Math.random() * 120);
    }
    cursor.remove();
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
    send.disabled = busy || !input.value.trim();
  }

  input.addEventListener("input", autosize);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true;
    addMessage("user", text);
    input.value = "";
    autosize();
    await respond();
    busy = false;
    autosize();
    input.focus();
  });

  document.getElementById("newChat").addEventListener("click", () => location.reload());
</script>
</body>
</html>
